name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: verify tag and create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: verify tag matches manifests
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          if [ "$VERSION" != "$CARGO" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src-tauri/Cargo.toml version $CARGO"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '/^## /{f=(index($0,"[" v "]")>0); next} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::no CHANGELOG.md section for $VERSION; falling back to generated notes"
            GENERATE="--generate-notes"
          else
            GENERATE=""
          fi
          cat >> notes.md <<'EOF'

          ---

          Built by CI from this tag.

          **macOS** — the app is ad-hoc signed and not notarized. If Gatekeeper blocks the first launch:

              xattr -dr com.apple.quarantine "/Applications/bd board.app"

          **Windows** — the installer is unsigned; SmartScreen reports an unknown publisher. Choose *More info* → *Run anyway*.
          EOF
          # Drafts are listed under their tag name, but the list can lag right after creation,
          # so reuse an existing draft/release when there is one and otherwise take the id
          # straight from the create call.
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | .id' | head -n1)
          if [ -z "$RELEASE_ID" ]; then
            if [ -n "$GENERATE" ]; then
              RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
                -f tag_name="$GITHUB_REF_NAME" -f name="bd board $VERSION" \
                -F draft=true -F generate_release_notes=true --jq .id)
            else
              RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
                -f tag_name="$GITHUB_REF_NAME" -f name="bd board $VERSION" \
                -f body="$(cat notes.md)" -F draft=true --jq .id)
            fi
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --bundles dmg
          - label: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --bundles dmg
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: configure Apple signing
        if: runner.os == 'macOS'
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          # Empty secrets must stay unset: tauri treats an empty APPLE_CERTIFICATE as a real certificate.
          if [ -n "$CERTIFICATE" ]; then
            {
              echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
              echo "APPLE_CERTIFICATE=$CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
              if [ -n "$API_ISSUER" ]; then echo "APPLE_API_ISSUER=$API_ISSUER"; fi
              if [ -n "$API_KEY" ]; then echo "APPLE_API_KEY=$API_KEY"; fi
            } >> "$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_INCREMENTAL: 0
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} ${{ matrix.args }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          releaseAssetNamePattern: '[mainBinaryName]_[version]_[platform]-[arch][_setup][ext]'
          retryAttempts: 1

  publish:
    name: publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=true -f make_latest=false
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=false -f make_latest=true
          fi
